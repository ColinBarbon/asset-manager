<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asset Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset & Variables ───────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f1117;
      --surface:   #181c27;
      --border:    #252a38;
      --muted:     #3a4055;
      --text:      #e2e6f0;
      --text-dim:  #8891a8;
      --accent:    #4f8ef7;
      --accent-dk: #3a70d4;
      --green:     #3ecf8e;
      --yellow:    #f7b44f;
      --red:       #f76f6f;
      --purple:    #b87fff;
      --mono:      'IBM Plex Mono', monospace;
      --sans:      'IBM Plex Sans', sans-serif;
      --radius:    6px;
      --sidebar-w: 224px;
    }

    html, body { height: 100%; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Sidebar ─────────────────────────────────────────── */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .sidebar-brand {
      padding: 20px 20px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-logo {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      border-radius: var(--radius);
      object-fit: contain;
    }
    .sidebar-brand h1 {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .sidebar-brand p {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 3px;
      font-family: var(--mono);
    }

    /* Stats */
    .sidebar-stats {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }
    .stat-item { display: flex; flex-direction: column; gap: 2px; }
    .stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); font-family: var(--mono); }
    .stat-value { font-size: 26px; font-family: var(--mono); font-weight: 500; color: var(--text); line-height: 1.2; }

    /* Filters */
    .sidebar-filters { padding: 16px 20px; flex: 1; }
    .filter-title { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); font-family: var(--mono); margin-bottom: 10px; }
    .filter-btn {
      display: flex; align-items: center; gap: 8px;
      width: 100%; padding: 8px 10px; border-radius: var(--radius);
      background: none; border: none; color: var(--text-dim);
      font-family: var(--sans); font-size: 13px; cursor: pointer;
      text-align: left; transition: all 0.15s;
    }
    .filter-btn:hover { background: var(--border); color: var(--text); }
    .filter-btn.active { background: rgba(79,142,247,0.12); color: var(--accent); }
    .filter-btn .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .filter-btn .count { margin-left: auto; font-family: var(--mono); font-size: 11px; opacity: 0.7; }
    .dot-all     { background: var(--text-dim); }
    .dot-avail   { background: var(--green); }
    .dot-assign  { background: var(--accent); }
    .dot-repair  { background: var(--yellow); }
    .dot-ordered { background: var(--purple); }
    .dot-pending { background: #f7944f; }
    .dot-retired { background: var(--muted); }

    .sidebar-footer { padding: 16px 20px; border-top: 1px solid var(--border); }
    .btn-add {
      width: 100%; padding: 10px; border-radius: var(--radius);
      background: var(--accent); border: none; color: #fff;
      font-family: var(--sans); font-size: 13px; font-weight: 600;
      cursor: pointer; transition: background 0.15s;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn-add:hover { background: var(--accent-dk); }

    .io-row { display: flex; gap: 8px; margin-top: 8px; }
    .btn-io {
      flex: 1; padding: 8px; border-radius: var(--radius);
      background: none; border: 1px solid var(--border); color: var(--text-dim);
      font-family: var(--sans); font-size: 12px; cursor: pointer; transition: all 0.15s;
    }
    .btn-io:hover { background: var(--border); color: var(--text); }

    /* ── Main ────────────────────────────────────────────── */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

    .topbar {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px;
      background: var(--surface);
    }
    .search-wrap { position: relative; flex: 1; max-width: 340px; }
    .search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-dim); pointer-events: none; }
    .search-input {
      width: 100%; padding: 8px 12px 8px 34px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text);
      font-family: var(--sans); font-size: 13px; outline: none;
      transition: border-color 0.15s;
    }
    .search-input:focus { border-color: var(--accent); }
    .search-input::placeholder { color: var(--text-dim); }
    .result-count { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--text-dim); white-space: nowrap; }

    /* ── Table ───────────────────────────────────────────── */
    .table-wrap { flex: 1; overflow: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead th {
      padding: 9px 14px; text-align: left;
      font-family: var(--mono); font-size: 10px; font-weight: 500;
      text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--text-dim); background: var(--surface);
      border-bottom: 1px solid var(--border);
      white-space: nowrap; position: sticky; top: 0; z-index: 1;
    }
    thead th.th-drag { cursor: grab; user-select: none; }
    thead th.th-drag:hover { color: var(--text); }
    thead th.th-dragging { opacity: 0.4; cursor: grabbing; }
    thead th.th-dropzone { box-shadow: inset 2px 0 0 0 var(--accent); color: var(--text); }
    thead th.th-sorted { color: var(--text); }
    .sort-ind { margin-left: 5px; font-size: 8px; color: var(--accent); vertical-align: middle; }
    tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
    tbody tr:hover { background: var(--surface); }
    tbody tr:last-child { border-bottom: none; }
    td { padding: 10px 14px; vertical-align: middle; }

    td.col-id     { font-family: var(--mono); font-size: 11px; color: var(--text-dim); width: 44px; }
    td.col-name   { font-weight: 500; min-width: 130px; }
    td.col-mono   { font-family: var(--mono); font-size: 11px; color: var(--text-dim); white-space: nowrap; }
    td.col-serial { font-family: var(--mono); font-size: 11px; color: var(--text-dim); max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    td.col-date   { font-family: var(--mono); font-size: 11px; color: var(--text-dim); white-space: nowrap; }
    td.col-notes  { max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-dim); font-size: 12px; }

    .jira-link       { text-decoration: none; }
    .jira-link:hover { text-decoration: underline; }

    /* Read-only field display (e.g. repair tickets in the edit modal) */
    .readonly-field {
      padding: 9px 11px; background: var(--bg);
      border: 1px solid var(--border); border-radius: var(--radius);
      font-family: var(--mono); font-size: 12px; min-height: 38px;
      display: flex; align-items: center; flex-wrap: wrap; gap: 2px;
    }

    /* Status badges */
    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 8px; border-radius: 20px;
      font-size: 11px; font-family: var(--mono); font-weight: 500; white-space: nowrap;
    }
    .badge::before { content: ''; width: 5px; height: 5px; border-radius: 50%; }
    .badge-available { background: rgba(62,207,142,0.12); color: var(--green); }
    .badge-available::before  { background: var(--green); }
    .badge-assigned  { background: rgba(79,142,247,0.12); color: var(--accent); }
    .badge-assigned::before   { background: var(--accent); }
    .badge-in-repair { background: rgba(247,180,79,0.12); color: var(--yellow); }
    .badge-in-repair::before  { background: var(--yellow); }
    .badge-ordered          { background: rgba(184,127,255,0.12); color: var(--purple); }
    .badge-ordered::before  { background: var(--purple); }
    .badge-pending-approval          { background: rgba(247,148,79,0.12); color: #f7944f; }
    .badge-pending-approval::before  { background: #f7944f; }
    .badge-retired   { background: rgba(58,64,85,0.4);    color: var(--text-dim); }
    .badge-retired::before    { background: var(--muted); }

    /* Row action buttons */
    .actions { display: flex; gap: 5px; justify-content: flex-end; }
    .btn-icon {
      padding: 4px 8px; border-radius: 4px; border: 1px solid var(--border);
      background: none; color: var(--text-dim); cursor: pointer;
      font-size: 11px; font-family: var(--mono); transition: all 0.15s;
    }
    .btn-icon:hover     { background: var(--border); color: var(--text); }
    .btn-icon.del:hover { border-color: var(--red); color: var(--red); background: rgba(247,111,111,0.08); }

    /* Empty state */
    .empty-state {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 80px 40px; color: var(--text-dim); gap: 12px;
    }
    .empty-state svg { opacity: 0.25; }
    .empty-state p   { font-size: 14px; }
    .empty-state small { font-family: var(--mono); font-size: 11px; }

    /* ── Modal ───────────────────────────────────────────── */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.65);
      display: flex; align-items: center; justify-content: center;
      z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .overlay.open { opacity: 1; pointer-events: all; }
    .modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; width: 500px; max-width: 96vw;
      transform: translateY(14px) scale(0.98); transition: transform 0.2s;
      max-height: 92vh; overflow-y: auto;
    }
    .overlay.open .modal { transform: translateY(0) scale(1); }
    .modal-header {
      padding: 20px 24px 16px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .modal-header h2  { font-size: 15px; font-weight: 600; }
    .modal-header span { font-family: var(--mono); font-size: 11px; color: var(--text-dim); margin-top: 2px; display: block; }
    .btn-close {
      background: none; border: none; color: var(--text-dim);
      font-size: 20px; cursor: pointer; line-height: 1; padding: 2px 6px;
      border-radius: 4px; transition: all 0.15s;
    }
    .btn-close:hover { background: var(--border); color: var(--text); }

    .modal-body   { padding: 20px 24px; display: grid; gap: 14px; }
    .modal-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; }

    /* Form fields */
    .field         { display: flex; flex-direction: column; gap: 5px; }
    .field label   { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); font-family: var(--mono); }
    .field input, .field select, .field textarea {
      padding: 9px 11px; background: var(--bg);
      border: 1px solid var(--border); border-radius: var(--radius);
      color: var(--text); font-family: var(--sans); font-size: 13px;
      outline: none; transition: border-color 0.15s; width: 100%;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
    .field textarea  { resize: vertical; min-height: 68px; }
    .field select    { appearance: none; cursor: pointer; }
    .field-row       { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .field-row-3     { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

    /* Inline validation error */
    .error-box {
      font-size: 12px; color: var(--red); font-family: var(--mono);
      padding: 9px 12px; background: rgba(247,111,111,0.08);
      border: 1px solid rgba(247,111,111,0.25); border-radius: var(--radius);
    }

    /* Buttons */
    .btn         { padding: 9px 18px; border-radius: var(--radius); font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s; border: 1px solid transparent; font-family: var(--sans); }
    .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-primary:hover { background: var(--accent-dk); border-color: var(--accent-dk); }
    .btn-ghost   { background: none; color: var(--text-dim); border-color: var(--border); }
    .btn-ghost:hover { background: var(--border); color: var(--text); }

    /* Toast */
    .toast {
      position: fixed; bottom: 24px; right: 24px; z-index: 200;
      padding: 10px 16px; border-radius: var(--radius);
      font-size: 12px; font-family: var(--mono);
      opacity: 0; transform: translateY(8px); pointer-events: none;
      transition: all 0.22s;
    }
    .toast.show    { opacity: 1; transform: translateY(0); }
    .toast.success { background: rgba(62,207,142,0.15); border: 1px solid var(--green); color: var(--green); }
    .toast.error   { background: rgba(247,111,111,0.15); border: 1px solid var(--red);   color: var(--red); }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 3px; }
  </style>
</head>
<body>

<!-- ── Sidebar ────────────────────────────────────────────────────── -->
<aside class="sidebar">
  <div class="sidebar-brand">
    <img class="brand-logo" src="/CHBGroupLogo.png" alt="CHB Group">
    <div class="brand-text">
      <h1>AssetMgr</h1>
      <p>inventory system</p>
    </div>
  </div>

  <div class="sidebar-stats">
    <div class="stat-item">
      <span class="stat-label">Total Assets</span>
      <span class="stat-value" id="stat-total">—</span>
    </div>
  </div>

  <div class="sidebar-filters">
    <div class="filter-title">Filter by Status</div>
    <button class="filter-btn active" data-status="" onclick="setFilter(this)">
      <span class="dot dot-all"></span> All
      <span class="count" id="cnt-all">0</span>
    </button>
    <button class="filter-btn" data-status="Available" onclick="setFilter(this)">
      <span class="dot dot-avail"></span> Available
      <span class="count" id="cnt-available">0</span>
    </button>
    <button class="filter-btn" data-status="Assigned" onclick="setFilter(this)">
      <span class="dot dot-assign"></span> Assigned
      <span class="count" id="cnt-assigned">0</span>
    </button>
    <button class="filter-btn" data-status="In Repair" onclick="setFilter(this)">
      <span class="dot dot-repair"></span> In Repair
      <span class="count" id="cnt-in-repair">0</span>
    </button>
    <button class="filter-btn" data-status="Ordered" onclick="setFilter(this)">
      <span class="dot dot-ordered"></span> Ordered
      <span class="count" id="cnt-ordered">0</span>
    </button>
    <button class="filter-btn" data-status="Pending Approval" onclick="setFilter(this)">
      <span class="dot dot-pending"></span> Pending Approval
      <span class="count" id="cnt-pending-approval">0</span>
    </button>
    <button class="filter-btn" data-status="Retired" onclick="setFilter(this)">
      <span class="dot dot-retired"></span> Retired
      <span class="count" id="cnt-retired">0</span>
    </button>
  </div>

  <div class="sidebar-footer">
    <button class="btn-add" onclick="openModal()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Add Asset
    </button>
    <div class="io-row">
      <button class="btn-io" onclick="exportCsv()">Export CSV</button>
      <button class="btn-io" onclick="document.getElementById('import-file').click()">Import CSV</button>
    </div>
    <input type="file" id="import-file" accept=".csv,text/csv" style="display:none" onchange="importCsv(event)" />
    <button class="btn-io" id="logout-btn" style="display:none; width:100%; margin-top:8px;" onclick="logout()">Sign out</button>
  </div>
</aside>

<!-- ── Main ───────────────────────────────────────────────────────── -->
<main class="main">
  <div class="topbar">
    <div class="search-wrap">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input class="search-input" id="search-input" type="text"
             placeholder="Search name, company, serial…" oninput="onSearch()" />
    </div>
    <span class="result-count" id="result-count"></span>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr id="thead-row"></tr>
      </thead>
      <tbody id="asset-tbody"></tbody>
    </table>
    <div class="empty-state" id="empty-state" style="display:none">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      <p>No assets found</p>
      <small>Adjust the search or filter, or add a new asset</small>
    </div>
  </div>
</main>

<!-- ── Modal ──────────────────────────────────────────────────────── -->
<div class="overlay" id="overlay" onclick="overlayClick(event)">
  <div class="modal">
    <div class="modal-header">
      <div>
        <h2 id="modal-title">Add Asset</h2>
        <span id="modal-subtitle"></span>
      </div>
      <button class="btn-close" onclick="closeModal()">×</button>
    </div>

    <div class="modal-body">
      <div id="form-error" class="error-box" style="display:none"></div>

      <!-- Name (full width) -->
      <div class="field">
        <label>Asset Name *</label>
        <input type="text" id="f-name" placeholder='e.g. MacBook Pro 14"' />
      </div>

      <!-- Category / Status -->
      <div class="field-row">
        <div class="field">
          <label>Category *</label>
          <select id="f-category">
            <option value="">— Select —</option>
            <option>Laptop</option><option>Desktop</option><option>Monitor</option><option>Phone</option>
            <option>Tablet</option><option>Printer</option><option>Server</option>
            <option>Keyboard</option><option>Mouse</option><option>Other</option>
          </select>
        </div>
        <div class="field">
          <label>Status *</label>
          <select id="f-status">
            <option>Available</option>
            <option>Assigned</option>
            <option>In Repair</option>
            <option>Ordered</option>
            <option>Pending Approval</option>
            <option>Retired</option>
          </select>
        </div>
      </div>

      <!-- Company / Serial Number -->
      <div class="field-row">
        <div class="field">
          <label>Company</label>
          <select id="f-company">
            <option value="">— Select —</option>
            <option>Air Unlimited</option>
            <option>BPL Sales</option>
            <option>CHB Group</option>
            <option>DM Industrial</option>
            <option>Dynamic Building Control</option>
            <option>EDA Mechanical</option>
            <option>G&amp;K Electric</option>
            <option>GTA Compressor Solutions</option>
            <option>J Hansen HVAC Group</option>
            <option>TBA Limited</option>
            <option>Wesley Machine</option>
          </select>
        </div>
        <div class="field">
          <label>Serial Number</label>
          <input type="text" id="f-serial_number" placeholder="e.g. C02XL0LFJGH5" />
        </div>
      </div>

      <!-- Assigned To / Purchase Date -->
      <div class="field-row">
        <div class="field">
          <label>Assigned To</label>
          <input type="text" id="f-assigned_to" placeholder="Employee name" />
        </div>
        <div class="field">
          <label>Purchase Date</label>
          <input type="date" id="f-purchase_date" />
        </div>
      </div>

      <!-- Notes -->
      <div class="field">
        <label>Notes</label>
        <textarea id="f-notes" placeholder="Optional notes…"></textarea>
      </div>

      <!-- Repair tickets (read-only; populated when editing an asset with tickets) -->
      <div class="field" id="f-repair-tickets-wrap" style="display:none">
        <label>Repair Tickets</label>
        <div id="f-repair-tickets" class="readonly-field"></div>
      </div>

      <!-- Change history (read-only; populated when editing an existing asset) -->
      <div class="field" id="f-history-wrap" style="display:none">
        <label>Change History</label>
        <div id="f-history" class="readonly-field" style="max-height:140px; overflow:auto;"></div>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-ghost"    onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary"  onclick="submitForm()">Save Asset</button>
    </div>
  </div>
</div>

<!-- ── Toast ──────────────────────────────────────────────────────── -->
<div class="toast" id="toast"></div>

<script>
  // ── State ──────────────────────────────────────────────
  let assets       = [];
  let activeFilter = "";
  let searchTerm   = "";
  let editingId    = null;
  let jiraBaseUrl  = ""; // set from /config; enables ticket deep-links when present

  // ── Columns ────────────────────────────────────────────
  // Single source of truth for the asset table. Header label + per-row cell
  // renderer live together so the table is driven entirely by `columnOrder`,
  // which the user can rearrange by dragging headers (persisted to localStorage).
  // The actions column is pinned to the end and is not part of this model.
  const COLUMNS = [
    { key: "id",            label: "#",             cell: a => `<td class="col-id">${a.id}</td>` },
    { key: "name",          label: "Name",          cell: a => `<td class="col-name">${esc(a.name)}</td>` },
    { key: "category",      label: "Category",      cell: a => `<td class="col-mono">${esc(a.category)}</td>` },
    { key: "company",       label: "Company",       cell: a => `<td>${a.company ? esc(a.company) : dim("—")}</td>` },
    { key: "serial_number", label: "Serial #",      cell: a => `<td class="col-serial" title="${esc(a.serial_number)}">${a.serial_number ? esc(a.serial_number) : dim("—")}</td>` },
    { key: "assigned_to",   label: "Assigned To",   cell: a => `<td>${a.assigned_to ? esc(a.assigned_to) : dim("—")}</td>` },
    { key: "status",        label: "Status",        cell: a => `<td>${badge(a.status)}</td>` },
    { key: "repair_ticket", label: "Repair Ticket", cell: a => `<td class="col-mono">${jiraCell(a)}</td>`,
      // No `repair_ticket` field exists on the asset — sort by the visible ticket
      // key (the open one, else the most recent in history).
      sortValue: a => {
        const hist = (a.repair_ticket_history || "").split(",").map(s => s.trim()).filter(Boolean);
        return a.jira_issue_key || hist[hist.length - 1] || "";
      } },
    { key: "purchase_date", label: "Purchase Date", cell: a => `<td class="col-date">${a.purchase_date ? esc(a.purchase_date) : dim("—")}</td>` },
    { key: "notes",         label: "Notes",         cell: a => `<td class="col-notes" title="${esc(a.notes)}">${a.notes ? esc(a.notes) : dim("—")}</td>` },
  ];
  const COL_ORDER_KEY = "assetColumnOrder";

  // Ordered list of column keys. Starts from any saved order, drops keys that no
  // longer exist, and appends any columns added since the order was saved — so a
  // new column always shows up even for users with a stale saved order.
  let columnOrder = loadColumnOrder();

  function loadColumnOrder() {
    const known = COLUMNS.map(c => c.key);
    let saved = [];
    try { saved = JSON.parse(localStorage.getItem(COL_ORDER_KEY)) || []; } catch { /* ignore */ }
    const ordered = saved.filter(k => known.includes(k));
    for (const k of known) if (!ordered.includes(k)) ordered.push(k);
    return ordered;
  }

  function saveColumnOrder() {
    try { localStorage.setItem(COL_ORDER_KEY, JSON.stringify(columnOrder)); } catch { /* ignore */ }
  }

  const colByKey = key => COLUMNS.find(c => c.key === key);

  // ── Boot ───────────────────────────────────────────────
  (async function boot() {
    try {
      const cfg = await api("GET", "/config");
      jiraBaseUrl = cfg.jiraBaseUrl || "";
      if (cfg.authEnabled) document.getElementById("logout-btn").style.display = "";
    } catch { /* links stay as plain text */ }
    renderHeader();
    fetchAssets();
  })();

  // ── API ────────────────────────────────────────────────

  async function api(method, path, body) {
    const opts = { method, headers: { "Content-Type": "application/json" } };
    if (body) opts.body = JSON.stringify(body);
    const res  = await fetch(path, opts);
    if (res.status === 401) { window.location = "/login"; throw { error: "Not signed in." }; }
    const data = await res.json();
    if (!res.ok) throw data;
    return data;
  }

  async function logout() {
    try { await fetch("/logout", { method: "POST" }); } catch { /* ignore */ }
    window.location = "/login";
  }

  async function fetchAssets() {
    try {
      const p = new URLSearchParams();
      if (searchTerm)   p.set("search", searchTerm);
      if (activeFilter) p.set("status", activeFilter);
      assets = await api("GET", `/assets?${p}`);
      renderTable();
      updateCounts();
    } catch {
      showToast("Failed to load assets", "error");
    }
  }

  // ── Render ─────────────────────────────────────────────

  // Draw the header row from `columnOrder`. Each data header is draggable so the
  // user can rearrange columns; the trailing actions header stays pinned.
  function renderHeader() {
    const row = document.getElementById("thead-row");
    const headers = columnOrder.map(key => {
      const col    = colByKey(key);
      const sorted = sortKey === col.key;
      const arrow  = sorted ? `<span class="sort-ind">${sortDir === "asc" ? "▲" : "▼"}</span>` : "";
      return `<th class="th-drag${sorted ? " th-sorted" : ""}" draggable="true" data-key="${col.key}"
                  onclick="colHeaderClick(event)"
                  ondragstart="colDragStart(event)" ondragend="colDragEnd(event)"
                  ondragover="colDragOver(event)" ondragleave="colDragLeave(event)"
                  ondrop="colDrop(event)" title="Click to sort · drag to reorder">${esc(col.label)}${arrow}</th>`;
    }).join("");
    row.innerHTML = headers + "<th></th>"; // pinned actions column
  }

  function renderTable() {
    const tbody = document.getElementById("asset-tbody");
    const empty = document.getElementById("empty-state");
    const count = document.getElementById("result-count");

    if (!assets.length) {
      tbody.innerHTML = "";
      empty.style.display = "flex";
      count.textContent   = "0 assets";
      return;
    }
    empty.style.display = "none";
    count.textContent   = `${assets.length} asset${assets.length !== 1 ? "s" : ""}`;

    tbody.innerHTML = sortedAssets().map(a => `
      <tr>
        ${columnOrder.map(key => colByKey(key).cell(a)).join("")}
        <td>
          <div class="actions">
            <button class="btn-icon"     onclick="openEditModal(${a.id})">edit</button>
            <button class="btn-icon del" onclick="deleteAsset(${a.id})">del</button>
          </div>
        </td>
      </tr>
    `).join("");
  }

  // ── Column sorting ─────────────────────────────────────
  let sortKey = null;       // null → server order (by id)
  let sortDir = "asc";      // "asc" | "desc"

  // Return assets sorted by the active column. Blank values always sink to the
  // bottom regardless of direction; numbers compare numerically, everything else
  // as locale-aware strings (so "2" < "10" and case is ignored).
  function sortedAssets() {
    if (!sortKey) return assets;
    const col = colByKey(sortKey);
    const valOf = col.sortValue || (a => a[sortKey]);
    const dir = sortDir === "asc" ? 1 : -1;
    const blank = v => v === null || v === undefined || v === "";
    return [...assets].sort((a, b) => {
      const x = valOf(a), y = valOf(b);
      if (blank(x) && blank(y)) return 0;
      if (blank(x)) return 1;
      if (blank(y)) return -1;
      if (typeof x === "number" && typeof y === "number") return (x - y) * dir;
      return String(x).localeCompare(String(y), undefined, { numeric: true, sensitivity: "base" }) * dir;
    });
  }

  // Click a header to sort by it; click again to flip direction. Suppressed right
  // after a drag (a drop can emit a trailing click) — see colDragStart/End.
  function colHeaderClick(e) {
    if (justDragged) return;
    const key = e.currentTarget.dataset.key;
    if (sortKey === key) sortDir = sortDir === "asc" ? "desc" : "asc";
    else { sortKey = key; sortDir = "asc"; }
    renderHeader();
    renderTable();
  }

  // ── Column drag-and-drop reordering ────────────────────
  let dragColKey  = null;
  let justDragged = false; // guards colHeaderClick against the click that trails a drop

  function colDragStart(e) {
    dragColKey  = e.currentTarget.dataset.key;
    justDragged = true;
    e.dataTransfer.effectAllowed = "move";
    e.currentTarget.classList.add("th-dragging");
  }
  function colDragEnd(e) {
    e.currentTarget.classList.remove("th-dragging");
    document.querySelectorAll(".th-dropzone").forEach(th => th.classList.remove("th-dropzone"));
    dragColKey = null;
    // Clear on the next tick — after any trailing click has been dispatched and
    // skipped — so the following genuine click sorts normally.
    setTimeout(() => { justDragged = false; }, 0);
  }
  function colDragOver(e) {
    if (dragColKey === null) return;
    e.preventDefault(); // allow drop
    e.dataTransfer.dropEffect = "move";
    if (e.currentTarget.dataset.key !== dragColKey) e.currentTarget.classList.add("th-dropzone");
  }
  function colDragLeave(e) {
    e.currentTarget.classList.remove("th-dropzone");
  }
  function colDrop(e) {
    e.preventDefault();
    const targetKey = e.currentTarget.dataset.key;
    if (dragColKey === null || targetKey === dragColKey) return;
    const from = columnOrder.indexOf(dragColKey);
    const to   = columnOrder.indexOf(targetKey);
    columnOrder.splice(from, 1);
    columnOrder.splice(to, 0, dragColKey);
    saveColumnOrder();
    renderHeader();
    renderTable();
  }

  function badge(status) {
    const cls = {
      "Available":        "badge-available",
      "Assigned":         "badge-assigned",
      "In Repair":        "badge-in-repair",
      "Ordered":          "badge-ordered",
      "Pending Approval": "badge-pending-approval",
      "Retired":          "badge-retired",
    }[status] || "badge-retired";
    return `<span class="badge ${cls}">${status}</span>`;
  }

  // Repair-ticket cell: the open ticket (yellow) takes priority; otherwise the
  // most recent past ticket (dimmed). "+N" flags older tickets, full list on hover.
  function jiraCell(a) {
    const open    = a.jira_issue_key || "";
    const history = (a.repair_ticket_history || "").split(",").map(s => s.trim()).filter(Boolean);
    if (!open && !history.length) return dim("—");

    const title = history.length ? `Repair tickets: ${history.join(", ")}` : "";
    const extra = history.length > 1 ? ` <span style="color:var(--text-dim)">+${history.length - 1}</span>` : "";
    const key   = open || history[history.length - 1];
    const label = ticketLink(key, open ? "var(--yellow)" : "var(--text-dim)");
    return `<span title="${esc(title)}">${label}${extra}</span>`;
  }

  // Build a single ticket reference (clickable when a Jira base URL is known).
  function ticketLink(key, color) {
    return jiraBaseUrl
      ? `<a class="jira-link" href="${esc(jiraBaseUrl)}/browse/${encodeURIComponent(key)}" target="_blank" rel="noopener" style="color:${color}">${esc(key)}</a>`
      : `<span style="color:${color}">${esc(key)}</span>`;
  }

  // Populate the read-only "Repair Tickets" block in the edit modal. Lists every
  // ticket (history + any open one), highlights the open ticket, hides if none.
  function renderRepairTickets(a) {
    const wrap = document.getElementById("f-repair-tickets-wrap");
    const box  = document.getElementById("f-repair-tickets");

    const open = a.jira_issue_key || "";
    const all  = (a.repair_ticket_history || "").split(",").map(s => s.trim()).filter(Boolean);
    if (open && !all.includes(open)) all.unshift(open); // safety: surface an open ticket not yet in history

    if (!all.length) { wrap.style.display = "none"; return; }

    box.innerHTML = all
      .map(key => {
        const isOpen = key === open;
        const link   = ticketLink(key, isOpen ? "var(--yellow)" : "var(--text-dim)");
        return isOpen ? `${link} <span style="color:var(--text-dim);font-size:10px">(open)</span>` : link;
      })
      .join('<span style="color:var(--muted)"> · </span>');
    wrap.style.display = "flex";
  }

  async function updateCounts() {
    try {
      // Lightweight tally endpoint — no need to re-download every row.
      const { total, byStatus } = await api("GET", "/assets/stats");
      const c = n => byStatus[n] || 0;

      document.getElementById("stat-total").textContent           = total;
      document.getElementById("cnt-all").textContent              = total;
      document.getElementById("cnt-available").textContent        = c("Available");
      document.getElementById("cnt-assigned").textContent         = c("Assigned");
      document.getElementById("cnt-in-repair").textContent        = c("In Repair");
      document.getElementById("cnt-ordered").textContent          = c("Ordered");
      document.getElementById("cnt-pending-approval").textContent = c("Pending Approval");
      document.getElementById("cnt-retired").textContent          = c("Retired");
    } catch { /* non-critical */ }
  }

  // ── Filter / Search ────────────────────────────────────

  function setFilter(btn) {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    activeFilter = btn.dataset.status;
    fetchAssets();
  }

  let _searchTimer;
  function onSearch() {
    clearTimeout(_searchTimer);
    _searchTimer = setTimeout(() => {
      searchTerm = document.getElementById("search-input").value.trim();
      fetchAssets();
    }, 250);
  }

  // ── Modal ──────────────────────────────────────────────

  function openModal() {
    editingId = null;
    document.getElementById("modal-title").textContent    = "Add Asset";
    document.getElementById("modal-subtitle").textContent = "";
    clearForm();
    document.getElementById("f-repair-tickets-wrap").style.display = "none"; // new assets have no tickets
    document.getElementById("f-history-wrap").style.display = "none";        // …and no history
    showOverlay();
  }

  function openEditModal(id) {
    const a = assets.find(x => x.id === id);
    if (!a) return;
    editingId = id;
    document.getElementById("modal-title").textContent    = "Edit Asset";
    document.getElementById("modal-subtitle").textContent = `ID #${id}`;
    populateForm(a);
    renderRepairTickets(a);
    renderHistory(id);
    showOverlay();
  }

  // Load and render the asset's audit trail (newest first). Hidden if empty.
  async function renderHistory(id) {
    const wrap = document.getElementById("f-history-wrap");
    const box  = document.getElementById("f-history");
    wrap.style.display = "none";
    box.innerHTML = "";
    try {
      const entries = await api("GET", `/assets/${id}/history`);
      if (!entries.length) return;
      box.innerHTML = entries.map(e => {
        const when = esc((e.at || "").replace("T", " ").replace("Z", ""));
        let detail = "";
        if (e.action === "update") {
          detail = Object.entries(e.changes)
            .map(([f, c]) => `${esc(f)}: ${esc(c.from || "∅")} → ${esc(c.to || "∅")}`)
            .join("; ");
        } else if (e.changes && e.changes.name) {
          detail = esc(e.changes.name);
        }
        return `<div style="padding:3px 0;border-bottom:1px solid var(--border)">`
             + `<span style="color:var(--accent);font-weight:600">${esc(e.action)}</span> `
             + `<span style="color:var(--text-dim);font-size:10px">${when}</span>`
             + (detail ? `<div style="color:var(--text-dim);font-size:11px">${detail}</div>` : "")
             + `</div>`;
      }).join("");
      wrap.style.display = "flex";
    } catch { /* history is non-critical */ }
  }

  function showOverlay() {
    document.getElementById("form-error").style.display = "none";
    document.getElementById("overlay").classList.add("open");
    setTimeout(() => document.getElementById("f-name").focus(), 150);
  }

  function closeModal() {
    document.getElementById("overlay").classList.remove("open");
  }

  function overlayClick(e) {
    if (e.target === document.getElementById("overlay")) closeModal();
  }

  // ── Form helpers ───────────────────────────────────────

  const FIELDS = ["name","category","status","company","serial_number","assigned_to","purchase_date","notes"];

  function clearForm() {
    FIELDS.forEach(f => {
      const el = document.getElementById(`f-${f}`);
      stripInjectedOptions(el);
      el.value = f === "status" ? "Available" : "";
    });
  }

  function populateForm(a) {
    FIELDS.forEach(f => {
      const el  = document.getElementById(`f-${f}`);
      const val = a[f] || (f === "status" ? "Available" : "");
      stripInjectedOptions(el);
      // For <select> fields, a stored value that isn't a predefined option
      // (e.g. a company added via the API) would otherwise be silently
      // dropped — and wiped on save. Inject it as an option so it round-trips.
      if (el.tagName === "SELECT" && val && !optionExists(el, val)) {
        const opt = document.createElement("option");
        opt.value = val;
        opt.textContent = val;
        opt.dataset.injected = "1";
        el.appendChild(opt);
      }
      el.value = val;
    });
  }

  function optionExists(selectEl, val) {
    return Array.from(selectEl.options).some(o => o.value === val);
  }

  function stripInjectedOptions(el) {
    if (el.tagName !== "SELECT") return;
    Array.from(el.options).forEach(o => { if (o.dataset.injected) o.remove(); });
  }

  function getFormData() {
    return Object.fromEntries(FIELDS.map(f => [f, document.getElementById(`f-${f}`).value.trim()]));
  }

  // ── CRUD ───────────────────────────────────────────────

  async function submitForm() {
    const data  = getFormData();
    const errEl = document.getElementById("form-error");
    errEl.style.display = "none";
    try {
      if (editingId === null) {
        await api("POST", "/assets", data);
        showToast("Asset created ✓", "success");
      } else {
        await api("PUT", `/assets/${editingId}`, data);
        showToast("Asset updated ✓", "success");
      }
      closeModal();
      fetchAssets();
    } catch (err) {
      const msg = err.errors ? err.errors.join(" ") : (err.error || "Something went wrong.");
      errEl.textContent    = msg;
      errEl.style.display  = "block";
    }
  }

  async function deleteAsset(id) {
    const a = assets.find(x => x.id === id);
    if (!confirm(`Delete "${a?.name}"? This cannot be undone.`)) return;
    try {
      await api("DELETE", `/assets/${id}`);
      showToast("Asset deleted", "success");
      fetchAssets();
    } catch {
      showToast("Failed to delete asset", "error");
    }
  }

  // ── CSV import / export ────────────────────────────────

  function exportCsv() {
    window.location = "/assets/export.csv"; // Content-Disposition triggers a download
  }

  async function importCsv(e) {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const res  = await fetch("/assets/import", {
        method: "POST",
        headers: { "Content-Type": "text/csv" },
        body: text,
      });
      const data = await res.json();
      if (!res.ok) throw data;

      const msg = data.failed
        ? `Imported ${data.inserted}, skipped ${data.failed}`
        : `Imported ${data.inserted} asset${data.inserted !== 1 ? "s" : ""} ✓`;
      showToast(msg, data.failed ? "error" : "success");
      if (data.errors && data.errors.length) console.warn("Import skipped rows:\n" + data.errors.join("\n"));
      fetchAssets();
    } catch (err) {
      showToast(err.error || "Import failed", "error");
    } finally {
      e.target.value = ""; // reset so the same file can be re-selected
    }
  }

  // ── Toast ──────────────────────────────────────────────

  let _toastTimer;
  function showToast(msg, type = "success") {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.className   = `toast ${type} show`;
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => el.classList.remove("show"), 2800);
  }

  // ── Keyboard shortcuts ─────────────────────────────────

  document.addEventListener("keydown", e => {
    if (e.key === "Escape") closeModal();
    if ((e.metaKey || e.ctrlKey) && e.key === "k") {
      document.getElementById("search-input").focus();
      e.preventDefault();
    }
  });

  // ── Utils ──────────────────────────────────────────────

  function esc(s) {
    return String(s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;")
      .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
  function dim(s) { return `<span style="color:var(--text-dim)">${s}</span>`; }
</script>
</body>
</html>
