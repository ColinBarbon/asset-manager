<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — AssetMgr</title>
  <style>
    :root {
      --bg: #0f1117; --panel: #161922; --border: #232733;
      --text: #e6e9ef; --text-dim: #8b93a7; --accent: #4f8ef7; --red: #f76e6e;
      --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .card {
      width: 320px; background: var(--panel); border: 1px solid var(--border);
      border-radius: 10px; padding: 28px 24px;
    }
    h1 { font-size: 17px; font-weight: 600; }
    p  { font-size: 12px; color: var(--text-dim); margin-top: 3px; margin-bottom: 20px; }
    label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
    input {
      width: 100%; padding: 9px 11px; font-size: 13px;
      background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 6px; outline: none;
    }
    input:focus { border-color: var(--accent); }
    button {
      width: 100%; margin-top: 16px; padding: 9px; font-size: 13px; font-weight: 600;
      color: #fff; background: var(--accent); border: none; border-radius: 6px; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: default; }
    .err { color: var(--red); font-size: 12px; margin-top: 12px; min-height: 16px; }
  </style>
</head>
<body>
  <form class="card" id="login-form">
    <h1>AssetMgr</h1>
    <p>Enter the shared password to continue</p>
    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password" autofocus />
    <button type="submit" id="submit">Sign in</button>
    <div class="err" id="err"></div>
  </form>

  <script>
    const form = document.getElementById("login-form");
    const err  = document.getElementById("err");
    const btn  = document.getElementById("submit");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      err.textContent = "";
      btn.disabled = true;
      try {
        const res = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: document.getElementById("password").value }),
        });
        if (res.ok) { window.location = "/"; return; }
        const data = await res.json().catch(() => ({}));
        err.textContent = data.error || "Sign in failed.";
      } catch {
        err.textContent = "Network error. Try again.";
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
